name: 'GitHub Pages — Deploy (pacific-consultancy-web-public)'
# This workflow is intended to run in the PUBLIC repository:
#   https://github.com/amitpuriofficial/pacific-consultancy-web-public
#
# GitHub Pages is enabled on that public repo (Settings > Pages > Source: GitHub Actions).
# The private repo (pacific-consultancy-web) pushes built files there via pc-web-gh-pages-io.yml,
# which then triggers this workflow automatically on push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The public repo contains pre-built static files at its root
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4